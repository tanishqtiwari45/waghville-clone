<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Navbar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light py-3">
        <div class="container-fluid">
            <a class="navbar-brand ps-5"  routerLink="/home">
				<img src="https://www.waghville.com/wp-content/uploads/2024/03/cropped-Waghville-Logo-110x75.png" alt="logo">
			</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end  pe-5" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active fw-bold" aria-current="page" routerLink="/home">Home</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle fw-bold text-dark" routerLink="/home" onmouseover="openDropdown(this)" onmouseleave="closeDropdown(this)" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                          Attractions
                        </a>
                        <ul class="dropdown-menu mt-4" aria-labelledby="navbarDropdown">
                          <li><a class="dropdown-item" routerLink="/waterpark">Water Park</a></li>
                          <li><a class="dropdown-item" routerLink="/adventure">Adventure Park</a></li>
                          <li><a class="dropdown-item" routerLink="/school">School Picnic</a></li>
                          <li><a class="dropdown-item" routerLink="/cuisine">Multi Cuisine Restaurant</a></li>
                        </ul>
                      </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle fw-bold text-dark" routerLink="/home"  id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                          Hospitality and Events
                        </a>
                        <ul class="dropdown-menu mt-4" aria-labelledby="navbarDropdown">
                          <li><a class="dropdown-item" routerLink="/luxury">Luxury Resorts</a></li>
                          <li><a class="dropdown-item" routerLink="/destination-wedding">Destination Wedding</a></li>
                          <li><a class="dropdown-item" routerLink="/corporate">Corporate Meetings and Party</a></li>
                        </ul>
                      </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-bold" routerLink="/about">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-bold" routerLink="/rules">Rules</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-bold" routerLink="/packages">Packages</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-bold" routerLink="/contact">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <script>
        function openDropdown(element) {
          let dropdownMenu = element.querySelector(".dropdown-menu");
          dropdownMenu.classList.add("show");
        }
        
        function closeDropdown(element) {
          let dropdownMenu = element.querySelector(".dropdown-menu");
          dropdownMenu.classList.remove("show");
        }
      </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<router-outlet/>
